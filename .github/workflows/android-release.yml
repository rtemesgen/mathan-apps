name: Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release.keystore
          cat > mobile/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build standalone web assets and sync Capacitor
        run: VITE_APP_VERSION="${VERSION_NAME#v}" VITE_BUILD_NUMBER="$GITHUB_RUN_NUMBER" npm run build
        working-directory: mobile

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PversionName="${VERSION_NAME#v}" -PversionCode="${GITHUB_RUN_NUMBER}"
        working-directory: mobile/android

      - name: Verify APK signature and create release verification files
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "versionName='${VERSION_NAME#v}'"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee mobile/android/app/build/outputs/apk/release/signing-certificate.txt
          sha256sum "$APK" > mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
          APK_SHA256=$(cut -d' ' -f1 mobile/android/app/build/outputs/apk/release/app-release.apk.sha256)
          cat > mobile/android/app/build/outputs/apk/release/release-manifest.json <<EOF
          {
            "app": "Mathan ERP",
            "version": "${VERSION_NAME#v}",
            "tag": "$GITHUB_REF_NAME",
            "commit": "$GITHUB_SHA",
            "versionCode": "$GITHUB_RUN_NUMBER",
            "apk": "app-release.apk",
            "sha256": "$APK_SHA256"
          }
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: mathan-erp-${{ github.ref_name }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            mobile/android/app/build/outputs/apk/release/signing-certificate.txt
            mobile/android/app/build/outputs/apk/release/release-manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            This release is signed with the Mathan ERP release key. Android may still show a Play Protect scan for APKs installed directly from GitHub because GitHub is outside Google Play.

            Verify the download with the attached `app-release.apk.sha256` checksum and `signing-certificate.txt` certificate details.
          files: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            mobile/android/app/build/outputs/apk/release/signing-certificate.txt
            mobile/android/app/build/outputs/apk/release/release-manifest.json

name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run complete frontend test suite
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
        working-directory: backend
      - name: Verify migration from the supported legacy schema
        run: |
          supabase db reset --local --version 202608260005 --sql-paths fixtures/legacy_upgrade_seed.sql
          supabase migration up --local
          supabase test db supabase/upgrade_tests/legacy_upgrade_contract.sql
        working-directory: backend
      - name: Verify fresh database and security contracts
        run: |
          supabase db reset --local --no-seed
          supabase test db
        working-directory: backend

  e2e:
    runs-on: ubuntu-latest
    needs: database
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: supabase start
        working-directory: backend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle
            mobile/android/gradle/wrapper/gradle-wrapper.properties
            mobile/android/app/*.gradle
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: mobile
      - run: npm run build
        working-directory: mobile
      - name: Run native Android unit tests, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
        working-directory: mobile/android
      - name: Run native Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: mobile/android
          script: ./gradlew connectedDebugAndroidTest

  required:
    name: Required CI gates
    if: always()
    needs: [frontend, database, e2e, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require every production-critical job
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$E2E_RESULT" = success
          test "$ANDROID_RESULT" = success

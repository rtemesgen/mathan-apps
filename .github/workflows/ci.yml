name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Keep the complete persistence, migration, queue, recovery, export, and
      # architecture suite as a required PR gate. Running only a hand-picked
      # subset here allowed offline-storage regressions to bypass CI.
      - name: Run complete frontend test suite
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
      - run: supabase start
        working-directory: backend
      - name: Verify migration from the supported legacy schema
        run: |
          supabase db reset --local --version 202608260005 --sql-paths fixtures/legacy_upgrade_seed.sql
          supabase migration up --local
          supabase test db supabase/upgrade_tests/legacy_upgrade_contract.sql
        working-directory: backend
      - name: Verify fresh database and security contracts
        run: |
          supabase db reset --local --no-seed
          supabase test db
        working-directory: backend

  e2e:
    runs-on: ubuntu-latest
    needs: database
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: supabase start
        working-directory: backend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    needs: [frontend, database]
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
      - name: Start disposable Supabase backend
        run: supabase start
        working-directory: backend
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle
            mobile/android/gradle/wrapper/gradle-wrapper.properties
            mobile/android/app/*.gradle
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: mobile
      - name: Seed disposable Android backend account
        run: npx tsx tests/e2e/globalSetup.ts
        working-directory: frontend
        env:
          SUPABASE_TELEMETRY_DISABLED: 'true'
      - name: Configure Android instrumentation backend
        run: npx tsx tests/e2e/androidBackendSetup.ts
        working-directory: frontend
      - run: npm run build:instrumentation
        working-directory: mobile
      - name: Run native Android unit tests, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
        working-directory: mobile/android
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run application/SQLite instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          cores: 2
          emulator-boot-timeout: 600
          # The force-stop/relaunch coverage exercises a second WebView process.
          # Use direct SwiftShader for deterministic WebView GLES/Vulkan
          # rendering on API 35; the indirect backend reports missing ES
          # configs and crashes the renderer during Activity recreation.
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile/android
          script: bash ../../.github/scripts/run-android-instrumentation.sh
      - name: Upload Android test reports and database diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
            mobile/android/app/build/android-diagnostics/
  required:
    name: Required CI gates
    if: always()
    needs: [frontend, database, e2e, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require every production-critical job
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$E2E_RESULT" = success
          test "$ANDROID_RESULT" = success
